site_name: Exploration Toolkit
site_url: https://mydomain.org/mysite
theme:
  name: material

  logo: images/icons/ET_Icon.png
  favicon: images/icons/ET_Icon.png

  font:
    text: Inter

  palette:
    #primary: custom
    scheme: slate

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    #- navigation.tabs
    #- navigation.tabs.sticky
    #- navigation.path
    - navigation.sections
    #- navigation.expand
    - search.suggest
    - content.code.copy

plugins:
  - search
  - print-site

markdown_extensions:
  - pymdownx.blocks.caption
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list

extra_css:  
  - stylesheets/extra.css

nav:
  - "👋 Welcome": welcome.md
  - "🎬 Quick Setup": quick-setup.md
  - Roadmap: roadmap.md
  - Systems:
    - Player:
      - Player Controller: player/player-controller.md
      - Input Manager: player/input-manager.md
      - Player Components: player/player-components.md
      - Crosshairs: player/crosshairs.md
      - Custom Player Controller: player/custom-player-controller.md
      - Player Stats: player/player-stats.md
    - Interaction:
      - Basic Setup: interaction/basic-setup.md
      - Pickup Objects: interaction/pickup-objects.md
      - Inspect Objects: interaction/inspect-objects.md
    - Mechanisms:
      - Doors: mechanisms/doors.md
      - Unlockables: mechanisms/unlockables.md
  - Scripting:
    - Custom Inspectors: scripting/custom-inspectors.md
    - ETSystemRegistry: scripting/etsystemregistry.md
  - Links:
    - Play the Demo: https://daniel-buckley.itch.io/exploration-toolkit
    - YouTube Tutorials: https://www.youtube.com/playlist?list=PL7QZMl1mSodk7QgdeduMBVBzTE5YeZBIA
    - Asset Store: https://assetstore.unity.com/packages/slug/336992